name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Allow the release workflow to reuse this as a gate.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Test
        # The suite is hermetic: PDF fixtures are committed under tests/pdf/ and the
        # arXiv API is mocked, so no network access is required here.
        run: pytest -q
