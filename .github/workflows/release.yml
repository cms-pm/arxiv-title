name: Release

# Publishes to PyPI when a GitHub Release is published. Creating the release is the
# manual gate; nothing publishes on a plain tag push or a branch commit.
on:
  release:
    types: [published]
  # Manual dry run: builds and uploads to TestPyPI without touching PyPI.
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        default: testpypi
        type: choice
        options: [testpypi, none]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata renders on PyPI
        run: python -m twine check --strict dist/*

      - name: Verify version matches the release tag
        # Guards the most common release mistake: tagging v0.2.0 while pyproject still
        # says 0.1.0. PyPI would reject the second upload of an existing version, but
        # only after the workflow had already claimed success elsewhere.
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's/.*-([0-9][^-]*)\.tar\.gz/\1/')
          echo "tag=$tag built=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::release tag $tag does not match package version $built"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/arxiv-title
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/arxiv-title
    permissions:
      id-token: write # OIDC token for Trusted Publishing; no API token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
