[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-title"
version = "0.1.0"
description = "Rename arXiv PDFs from opaque IDs to descriptive, title-based filenames"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pdfplumber>=0.11",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
arxiv-title = "arxiv_title.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
