[build-system]
# 77+ for PEP 639 SPDX `license` / `license-files` support.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-title"
version = "0.2.0"
description = "Rename arXiv PDFs from opaque IDs to descriptive, title-based filenames"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris Slothouber", email = "chris@praqsys.net" }]
requires-python = ">=3.10"
keywords = ["arxiv", "pdf", "rename", "cli", "bibliography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "pdfplumber>=0.11",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/cms-pm/arxiv-title"
Repository = "https://github.com/cms-pm/arxiv-title"
Issues = "https://github.com/cms-pm/arxiv-title/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# `--markdown` shells out to the markitdown CLI; it is not needed otherwise.
markdown = ["markitdown[pdf]>=0.1"]

[project.scripts]
arxiv-title = "arxiv_title.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
